# Safe Counter: Postgres, the mock AI, the scribe agent, a one-shot migrator, and the API.
# The API container holds only the restricted app credentials (sc_app).
# Owner credentials live only in the migrate and tools containers.
# Two networks: Postgres and the main API are on "backend" only; the AI side (mock_ai,
# scribe_agent) is on "ai" only. ai_ingress is the one service on both: the agent cannot
# reach the database or any staff route, only the task-result endpoint (Level 2F, D27, D30).

x-owner-env: &owner-env
  OWNER_DATABASE_URL: postgresql://sc_owner:owner_pw@db:5432/safecounter
  APP_DB_PASSWORD: app_pw
  DELIVERY_DB_PASSWORD: delivery_pw

x-app-env: &app-env
  DATABASE_URL: postgresql://sc_app:app_pw@db:5432/safecounter
  AI_URL: http://mock_ai:8099/v1/propose
  AI_DEADLINE_SECONDS: "5"
  ALLOW_AI_MODE_OVERRIDE: "1"

networks:
  backend: {}
  ai: {}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sc_owner
      POSTGRES_PASSWORD: owner_pw
      POSTGRES_DB: safecounter
    ports: ["5433:5432"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sc_owner -d safecounter"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock_ai:
    image: python:3.12-slim
    command: ["python3", "/mock/mock_ai_server.py"]
    environment:
      MOCK_HOST: 0.0.0.0
      MOCK_PORT: "8099"
    volumes: ["./mock_ai:/mock:ro"]
    ports: ["8099:8099"]
    networks: [ai]

  # The AI process: calls the model, submits results with a single-use task token.
  # No database credentials and no route to the database.
  scribe_agent:
    build: .
    command: ["python", "-m", "safecounter.scribe_agent"]
    environment:
      AI_URL: http://mock_ai:8099/v1/propose
      AI_DEADLINE_SECONDS: "5"
      SCRIBE_AGENT_HOST: 0.0.0.0
      SCRIBE_AGENT_PORT: "8097"
    # No bind mount: runs from its image, which holds no .env or compose file (D30).
    networks: [ai]
    depends_on:
      mock_ai: {condition: service_started}

  # The only API the agent can reach: task-result submission and the task hand-off relay.
  ai_ingress:
    build: .
    command: ["uvicorn", "safecounter.ai_ingress:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://sc_app:app_pw@db:5432/safecounter
      INGRESS_AGENT_URL: http://scribe_agent:8097/tasks
    networks: [backend, ai]
    depends_on:
      migrate: {condition: service_completed_successfully}
      scribe_agent: {condition: service_started}

  migrate:
    build: .
    command: ["python", "-m", "safecounter.admin", "init"]
    environment: *owner-env
    volumes: [".:/app"]
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}

  api:
    build: .
    command: ["uvicorn", "safecounter.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
      AI_TRANSPORT: agent
      SCRIBE_AGENT_URL: http://ai_ingress:8000/dispatch
      CALLBACK_BASE_URL: http://ai_ingress:8000
    volumes: [".:/app"]
    ports: ["8080:8000"]
    networks: [backend]
    depends_on:
      migrate: {condition: service_completed_successfully}
      ai_ingress: {condition: service_started}

  # Optional real-model API (D23): docker compose --profile real up -d api_real
  # Reads GROQ_API_KEY from the local, git-ignored .env. Same restricted DB role.
  api_real:
    build: .
    profiles: ["real"]
    command: ["uvicorn", "safecounter.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
      AI_PROVIDER: groq
      ALLOW_AI_MODE_OVERRIDE: "0"
    env_file:
      - path: ./.env
        required: false
    volumes: [".:/app"]
    ports: ["8081:8000"]
    networks: [backend]
    depends_on:
      migrate: {condition: service_completed_successfully}

  # Runs tests and admin commands: docker compose run --rm tools pytest
  # AI_PROVIDER is unset here, so tests use the mock; the key is only used by the evaluation.
  tools:
    build: .
    profiles: ["tools"]
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: [*owner-env, *app-env]
      AI_DEADLINE_SECONDS: "2"
      SC_API: http://api:8000
      DELIVERY_DATABASE_URL: postgresql://sc_delivery:delivery_pw@db:5432/safecounter
    volumes: [".:/app"]
    networks: [backend, ai]
    depends_on:
      db: {condition: service_healthy}
      mock_ai: {condition: service_started}
